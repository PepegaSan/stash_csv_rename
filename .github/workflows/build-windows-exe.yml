# Builds dist/Stashmarker.exe as a downloadable artifact (Windows).
# Attach the artifact to a GitHub Release manually, or download from the workflow run.

name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: PyInstaller
        run: python -m PyInstaller --noconfirm stashmarker.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stashmarker-Windows
          path: dist/Stashmarker.exe
